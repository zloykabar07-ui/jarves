name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Логика ассистента кроссплатформенная (Windows-специфика спрятана за заглушками в тестах),
    # поэтому гоняем на Linux: быстрее и дешевле.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка линтера
        run: python -m pip install --upgrade pip pyflakes
      - name: Статический анализ
        run: python -m pyflakes .
      - name: Тесты
        run: python -m unittest discover -s tests -v
